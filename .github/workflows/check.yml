name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - run: moon update
      - name: moon check (warnings are errors)
        run: moon check --deny-warn
      - name: moon fmt (no diff)
        run: moon fmt --check
      - name: mooncram (native CLI)
        working-directory: uml-cli
        run: moonx moonbit-community/mooncram@0.0.8 test --target native --timeout-ms 300000 cram/cli.md
