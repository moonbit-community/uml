name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show MoonBit versions
        run: moon version --all

      - name: Update dependencies
        run: moon update

      - name: Check code (warnings are errors)
        run: moon check --deny-warn

      - name: Check formatting
        run: moon fmt --check
      
      - name: test
        run: moon test --target all

      - name: Run CLI cram tests
        working-directory: uml-cli
        run: >-
          moonx moonbit-community/mooncram@0.0.8 test
          --target native
          --timeout-ms 300000
          cram/cli.md
