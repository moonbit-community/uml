# Publishes workspace modules to mooncakes.io. Triggered manually from the
# Actions tab; credentials for both owners must be configured.
name: publish

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "publish"
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: install moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      - name: prepublish check
        run: |
          moon check
          moon test
          moon -C uml_cli cram test --release tests/cram

      # The library must go first: uml_cli resolves kokic/uml from the
      # registry at publish time.
      - name: publish kokic/uml
        env:
          MOONCAKES_CREDENTIALS: ${{ secrets.MOONCAKES_KOKIC_CREDENTIALS }}
        run: moon -C uml publish

      # Validate outside moon.work so the CLI resolves exactly the version
      # that its published manifest names, rather than the local workspace copy.
      - name: verify published uml dependency
        run: |
          cli_dir=$(mktemp -d "$RUNNER_TEMP/uml-cli-release.XXXXXX")
          cp -R uml_cli/. "$cli_dir/"
          moon update
          moon -C "$cli_dir" check
          moon -C "$cli_dir" cram test --release tests/cram

      - name: publish moonbit-community/uml_cli
        env:
          MOONCAKES_CREDENTIALS: ${{ secrets.MOONCAKES_MOONBIT_COMMUNITY_TOKEN }}
        run: moon -C uml_cli publish
