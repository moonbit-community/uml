# Publishes uml to mooncakes.io. `uml-cli` and `live` are intentionally not published.
name: Publish packages

on:
  workflow_dispatch:
  release:
    types: [released]

permissions:
  contents: read

# Serialize releases, including manual retries, across refs.
concurrency:
  group: mooncakes-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: install
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: moon version
        run: |
          moon version --all
          moon update

      - name: Validate UML
        shell: bash
        run: |
          set -euo pipefail
          # Explicit paths exclude other workspace modules from validation.
          packages=()
          while IFS= read -r manifest; do
            packages+=("${manifest%/moon.pkg}")
          done < <(git ls-files 'uml/moon.pkg' 'uml/**/moon.pkg')
          test "${#packages[@]}" -gt 0
          moon check --deny-warn "${packages[@]}"
          moon info "${packages[@]}"
          git diff --exit-code -- uml
          moon test "${packages[@]}"
          moon fmt --check "${packages[@]}"
          git diff --exit-code -- uml

      - name: Publish UML
        working-directory: uml
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SECRET" || { echo "Missing Mooncakes token" >&2; exit 1; }
          umask 077
          mkdir -p "$HOME/.moon"
          trap 'rm -f "$HOME/.moon/credentials.json"' EXIT
          printf '%s\n' "$SECRET" > "$HOME/.moon/credentials.json"
          moon publish
        env:
          SECRET: ${{ secrets.MOONCAKES_MOONBIT_COMMUNITY_TOKEN }}
