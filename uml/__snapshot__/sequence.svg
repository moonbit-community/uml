.divider-title{fill:#f6f6f6}
.divider-label{font-size:12px;font-weight:bold}
.delay{stroke:#777;stroke-dasharray:3 3}
.reference{fill:none;stroke:#181818;stroke-width:1.2}
.reference-tab{fill:#eee;stroke:#181818;stroke-width:1.2}
.reference-tab-label{fill:#000000;font-size:12px;font-weight:bold}
.group-separator{stroke:#181818;stroke-dasharray:4 3}
.page-break{stroke:#555;stroke-width:1.2;stroke-dasharray:8 4}
.page-label{font-size:12px;font-style:italic}
.destroy{stroke-width:2}
</style><rect x="0" y="0" width="408" height="425" fill="none"/><g class="group" data-keyword="alt"><rect x="5" y="169" width="207" height="130" class="group-body" fill="#E2E2F0"/><line x1="5" y1="227" x2="212" y2="227" class="group-separator"/><text x="13" y="239" text-anchor="start" fill="#000000" class="group-label"><tspan x="13" dy="0">[invalid credentials]</tspan></text>
